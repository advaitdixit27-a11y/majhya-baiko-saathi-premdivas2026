<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Briefing ❤️</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #fff0f3; font-family: 'Segoe UI', sans-serif; text-align: center; color: #4a4a4a; }
        .container { padding: 20px; max-width: 800px; }
        h1 { color: #ff4d6d; }
        button, .btn { padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 10px; transition: 0.3s; display: inline-block; text-decoration: none; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #8e9aaf; color: white; position: absolute; }
        .hidden { display: none; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .gallery img { width: 100%; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 4px solid white; }
        .survey-btn { background-color: #7209b7; color: white; }
        .secret-btn { background-color: #ff9e00; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div id="level1">
            <h1>Will you be my Valentine? ❤️</h1>
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>

        <div id="finalPage" class="hidden">
            <h1>BEST DECISION EVER!!! 😍</h1>
            <div class="gallery">
                <img src="https://github.com/advaitdixit27-a11y/majhya-baiko-saathi-premdivas2026/blob/main/Gemini_Generated_Image_unfpffunfpffunfp.png?raw=true">
                <img src="https://github.com/advaitdixit27-a11y/majhya-baiko-saathi-premdivas2026/blob/main/Gemini_Generated_Image_5z89nw5z89nw5z89.png?raw=true">
                <img src="https://github.com/advaitdixit27-a11y/majhya-baiko-saathi-premdivas2026/blob/main/Gemini_Generated_Image_cdhaaucdhaaucdha.png?raw=true">
            </div>
            
            <h3>Annual Performance Review</h3>
            <p>Please complete your evaluation to unlock the secret gift.</p>
            <a href="https://forms.office.com/r/7HHeY43LjG" class="btn survey-btn" target="_blank" onclick="revealSecret()">Open Survey</a>

            <div id="secretLevel" class="hidden">
                <button class="btn secret-btn" onclick="alert('REWARD UNLOCKED! 🎁')">Claim Your Reward</button>
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        yesBtn.addEventListener('click', () => {
            document.getElementById('level1').classList.add('hidden');
            document.getElementById('finalPage').classList.remove('hidden');
        });

        function revealSecret() {
            setTimeout(() => { document.getElementById('secretLevel').classList.remove('hidden'); }, 2000);
        }
    </script>
</body>
</html>
